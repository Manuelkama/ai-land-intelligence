<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f5f2">
<meta name="description" content="Explore land opportunities with parcel context, development signals, and transparent investment scenarios.">
<title>AI Land Intelligence — Prototype</title>
<style>
:root{--accent:#1d756d;--ink:#172422;--muted:#65716f;--line:#e3e8e4;--paper:#fff;--wash:#f4f5f2;--soft:#edf5f1;--shadow:0 18px 50px rgba(31,52,47,.07)}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}body:before{content:"";position:fixed;z-index:-1;top:-260px;right:-170px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent),transparent 88%),transparent 68%);pointer-events:none}.shell{max-width:1200px;margin:0 auto;padding:26px 28px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}.brand{display:flex;align-items:center;gap:11px;font-size:14px;font-weight:750;letter-spacing:.03em}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--accent);color:white;font-size:18px}.top-meta{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#78ad82}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin-bottom:29px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}.hero h1{max-width:760px;margin:11px 0 8px;font-size:clamp(32px,5vw,54px);line-height:1.05;letter-spacing:-.045em}.hero p{max-width:700px;margin:0;color:var(--muted);font-size:16px}.hero-actions{display:flex;flex-wrap:wrap;gap:10px;padding-bottom:2px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;transition:transform .15s,box-shadow .15s,background .15s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--accent);color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--accent),transparent 76%)}.btn-light{background:#fff;color:var(--ink);border:1px solid var(--line)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:26px 0 20px}.metric{padding:17px 19px;background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 20px rgba(31,52,47,.025)}.metric-label{color:var(--muted);font-size:12px;font-weight:650}.metric-value{margin:5px 0 1px;font-size:25px;font-weight:760;letter-spacing:-.03em}.metric-detail{color:var(--muted);font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.85fr);gap:17px;align-items:start}.main-column,.side-column{display:grid;gap:17px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.list-panel{padding:21px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:17px}.panel h2,.panel h3{margin:0;letter-spacing:-.025em}.panel h2{font-size:20px}.panel h3{font-size:16px}.panel-sub{margin:4px 0 0;color:var(--muted);font-size:12px}.search{width:min(260px,42vw);border:1px solid var(--line);border-radius:11px;background:#fafbf9;padding:10px 12px;outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 88%);outline:none}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.filter{border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);padding:6px 11px;font-size:11px;font-weight:700}.filter.active{border-color:transparent;background:var(--soft);color:var(--accent)}.items{display:grid;gap:9px}.item{display:grid;grid-template-columns:1fr auto;gap:13px;padding:15px;border:1px solid var(--line);border-radius:15px;transition:border .15s,transform .15s}.item:hover{border-color:color-mix(in srgb,var(--accent),white 45%);transform:translateY(-1px)}.item-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.item h3{margin:0;font-size:14px}.badge{border-radius:999px;padding:3px 8px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:750}.item p{margin:6px 0 7px;color:var(--muted);font-size:12px}.item-foot{font-size:11px;color:#7a8582}.item-actions{display:flex;flex-direction:column;gap:6px;align-items:stretch}.text-btn{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);padding:6px 9px;font-size:11px;font-weight:700}.text-btn.saved{color:var(--accent);background:var(--soft);border-color:transparent}.empty{padding:24px;text-align:left;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:15px;background:linear-gradient(145deg,#fbfcfa,#fff)}.empty strong{display:block;margin:5px 0;color:var(--ink);font-size:15px}.empty p{max-width:590px;margin:7px 0 13px;line-height:1.6}.improve-label{margin:12px 0 6px;color:var(--ink);font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}.improvement-list{display:grid;gap:7px;margin:0;padding-left:18px;font-size:11px}.improvement-list li{padding-left:2px}.empty-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--soft);color:var(--accent);font-weight:800}.tool-panel{padding:20px;background:linear-gradient(160deg,#fff 0%,color-mix(in srgb,var(--accent),white 93%) 100%)}.tool-panel .tool-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.tool-icon{display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:var(--soft);color:var(--accent);font-weight:850}.tool-panel p{margin:8px 0 14px;color:var(--muted);font-size:12px}.control{width:100%;min-height:42px;border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px 11px;color:var(--ink)}textarea.control{min-height:120px;resize:vertical;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}.tool-panel .btn{width:100%;margin-top:9px}.tool-output{min-height:35px;margin-top:12px;border-radius:11px;background:rgba(255,255,255,.76);padding:10px 11px;color:#53615e;font-size:11px}.tool-output:empty{display:none}.check-panel,.activity-panel,.note-panel{padding:19px}.check-list,.activity-list{display:grid;gap:10px;margin:15px 0 0;padding:0;list-style:none}.check-row{display:flex;align-items:flex-start;gap:10px;color:#35403e;font-size:12px;cursor:pointer}.check{display:grid;place-items:center;width:17px;height:17px;flex:0 0 auto;border:1px solid #cbd4cf;border-radius:6px;color:#fff;font-size:10px}.check-row.done .check{background:var(--accent);border-color:var(--accent)}.check-row.done .check::after{content:'✓'}.check-row.done span:last-child{color:#8a9491;text-decoration:line-through}.activity-row{display:flex;gap:10px;align-items:flex-start;color:var(--muted);font-size:11px}.activity-dot{width:7px;height:7px;margin-top:6px;flex:0 0 auto;border-radius:50%;background:var(--accent)}.add-panel{padding:18px 20px}.add-panel p{margin:4px 0 13px;color:var(--muted);font-size:12px}.add-form{display:flex;gap:8px}.add-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;background:#fafbf9;padding:10px 11px}.add-form .btn{padding-inline:13px}.note-panel{background:#f8faf7;box-shadow:none}.note-panel p{margin:7px 0 0;color:var(--muted);font-size:11px}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:24px;color:#87918e;font-size:10px}.toast{position:fixed;right:24px;bottom:23px;max-width:360px;padding:13px 16px;border-radius:13px;background:#172422;color:#fff;box-shadow:0 12px 35px rgba(10,24,20,.22);font-size:12px;opacity:0;transform:translateY(12px);pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:translateY(0)}@media(max-width:850px){.workspace{grid-template-columns:1fr}.side-column{grid-template-columns:repeat(2,minmax(0,1fr))}.tool-panel{grid-column:1/-1}}@media(max-width:620px){.shell{padding:18px 14px 35px}.topbar{margin-bottom:34px}.hero{align-items:flex-start;flex-direction:column}.hero-actions{width:100%}.hero-actions .btn{flex:1}.metrics{gap:8px}.metric{padding:13px 11px}.metric-value{font-size:20px}.workspace{gap:12px}.list-panel{padding:15px}.panel-head{flex-direction:column}.search{width:100%}.side-column{grid-template-columns:1fr}.item{grid-template-columns:1fr}.item-actions{flex-direction:row}.footer{flex-direction:column}.add-form{flex-direction:column}.add-form .btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><span class="mark" id="brand-mark">✦</span><span id="brand-name">PROJECT</span></div><div class="top-meta"><span class="dot"></span><span>Interactive prototype</span><span>•</span><span>Live sources: not connected</span></div></header>
<section class="hero"><div><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1><p id="summary"></p></div><div class="hero-actions"><button class="btn btn-primary" id="main-action"></button><button class="btn btn-light" id="saved-view">Saved items</button></div></section>
<section class="metrics" id="metrics" aria-label="Project summary"></section>
<section class="workspace"><div class="main-column"><div class="panel list-panel"><div class="panel-head"><div><h2 id="section-title"></h2><p class="panel-sub" id="section-note"></p></div><input class="search" id="search" type="search" aria-label="Search items" placeholder="Search this workspace"></div><div class="filters" id="filters"></div><div class="items" id="items" aria-live="polite"></div></div><div class="panel add-panel"><h3 id="add-title"></h3><p>Records you add stay on this device.</p><form class="add-form" id="add-form"><input id="add-input" maxlength="100" required><button class="btn btn-primary" type="submit">Add item</button></form></div></div><aside class="side-column"><section class="panel tool-panel" id="tool-panel"></section><section class="panel check-panel"><h3>Project checklist</h3><ul class="check-list" id="check-list"></ul></section><section class="panel activity-panel"><h3>Recent activity</h3><ul class="activity-list" id="activity-list"></ul></section><section class="panel note-panel"><h3>Prototype note</h3><p id="prototype-note"></p></section></aside></section>
<footer class="footer"><span id="footer-title"></span><span>Standalone HTML • No backend or external services</span></footer>
</div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const APP = {"slug":"ai-land-intelligence","title":"AI Land Intelligence","eyebrow":"LAND • INVESTMENT RESEARCH","summary":"Explore land opportunities with parcel context, development signals, and transparent investment scenarios.","accent":"#1d756d","section":"Opportunity map","section_note":"Add verified parcels and market sources before ranking opportunities.","categories":["Growth","Rural","Mixed use"],"items":[],"checklist":["Confirm parcel ownership","Review zoning and access","Compare return scenarios"],"activity":[],"tool":{"title":"Check land data readiness","prompt":"Enter an area or parcel identifier. Parcel records and ROI calculations require verified sources.","mode":"text","placeholder":"County, parcel ID, or source to connect","button":"Review data needs","success":"No verified land source is connected. Connect ownership, zoning, comparable sale, infrastructure, and development-plan data before analysis."},"action":"analyze","add_label":"Add an area to watch","add_placeholder":"City, county, or parcel label","note":"No parcel listings or prices are fabricated. ROI stays unavailable until traceable real data and assumptions are supplied.","metrics":[["Parcel records","0","No verified parcel source connected"],["Market data","Not connected","No current comps or development feeds"],["ROI estimate","Unavailable","Requires verified costs and assumptions"]],"recordLabel":"land records","emptyTitle":"No verified parcel records yet","emptyDescription":"This workspace is empty until real parcel and market information is connected or entered by you.","improvements":["Connect county assessor and parcel ownership records.","Add zoning, flood, utilities, and planned infrastructure sources.","Use dated comparable sales and publish assumptions before estimating ROI."],"noDataAction":"No real parcel or market data is connected, so ROI analysis is unavailable. Improve this by connecting verified ownership, zoning, costs, and comparable sales.","add_note":"Only information you enter stays on this device. Nothing is sent to a server."};
const esc = value => String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const storageKey = 'prototype-v2:' + APP.slug;
let items = [];
try { const savedItems=JSON.parse(localStorage.getItem(storageKey+':items')||'[]'); if(Array.isArray(savedItems)) items=savedItems; } catch(e) {}
let analysisRuns = 0;
try { analysisRuns=Number(localStorage.getItem(storageKey+':runs')||'0'); } catch(e) {}
function persistItems(){try{localStorage.setItem(storageKey+':items',JSON.stringify(items))}catch(e){}}
let saved = new Set();
let activeCategory = 'All';
let showSaved = false;
let checklistDone = new Set();
let activity = [...APP.activity];
try { saved = new Set(JSON.parse(localStorage.getItem(storageKey+':saved')||'[]')); checklistDone = new Set(JSON.parse(localStorage.getItem(storageKey+':check')||'[]')); } catch(e) {}
document.documentElement.style.setProperty('--accent', APP.accent);
document.getElementById('brand-name').textContent = APP.title;
const initials = (APP.title.match(/[A-Za-z0-9]+/g)||['P']).slice(0,2).map(x=>x[0]).join('').toUpperCase();
document.getElementById('brand-mark').textContent = initials;
document.getElementById('eyebrow').textContent = APP.eyebrow;
document.getElementById('title').textContent = APP.title;
document.getElementById('summary').textContent = APP.summary;
document.getElementById('section-title').textContent = APP.section;
document.getElementById('section-note').textContent = APP.section_note;
document.getElementById('add-title').textContent = APP.add_label;
document.querySelector('.add-panel p').textContent = APP.add_note;
document.getElementById('add-input').placeholder = APP.add_placeholder;
document.getElementById('prototype-note').textContent = APP.note;
document.getElementById('footer-title').textContent = APP.title + ' • Front-end concept demo';
document.getElementById('main-action').textContent = APP.tool.button;
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.classList.remove('show'),3200)}
function renderMetrics(){const metrics=APP.metrics.map(m=>[...m]);if(metrics.length){if(APP.action==='code')metrics[0][1]=String(analysisRuns);else if(APP.action==='step')metrics[0][1]=`${checklistDone.size} of ${APP.checklist.length}`;else metrics[0][1]=String(items.length)}document.getElementById('metrics').innerHTML=metrics.map(m=>`<article class="metric"><div class="metric-label">${esc(m[0])}</div><div class="metric-value">${esc(m[1])}</div><div class="metric-detail">${esc(m[2])}</div></article>`).join('')}
function renderFilters(){const cats=['All',...new Set([...APP.categories,...items.map(x=>x.category)]),'Saved'];document.getElementById('filters').innerHTML=cats.map(cat=>`<button class="filter ${(cat==='Saved'?showSaved&&activeCategory==='All':!showSaved&&activeCategory===cat)?'active':''}" data-cat="${esc(cat)}">${esc(cat)}</button>`).join('');document.querySelectorAll('.filter').forEach(btn=>btn.addEventListener('click',()=>{if(btn.dataset.cat==='Saved'){showSaved=true;activeCategory='All'}else{showSaved=false;activeCategory=btn.dataset.cat}renderFilters();renderItems()}))}
function renderItems(){const query=document.getElementById('search').value.trim().toLowerCase();let shown=items.filter(item=>{const text=[item.title,item.detail,item.foot,item.category,item.status].join(' ').toLowerCase();return (!query||text.includes(query))&&(activeCategory==='All'||item.category===activeCategory)&&(!showSaved||saved.has(item.id))});const host=document.getElementById('items');if(!shown.length){if(items.length===0){host.innerHTML=`<div class="empty"><span class="empty-icon">↗</span><strong>${esc(APP.emptyTitle)}</strong><p>${esc(APP.emptyDescription)}</p><div class="improve-label">Suggestions to improve this app</div><ul class="improvement-list">${APP.improvements.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}else{host.innerHTML='<div class="empty">No records match these filters. Adjust your search or add a real record.</div>'}return}host.innerHTML=shown.map(item=>`<article class="item"><div><div class="item-top"><h3>${esc(item.title)}</h3><span class="badge">${esc(item.status)}</span></div><p>${esc(item.detail)}</p><div class="item-foot">${esc(item.foot)}</div></div><div class="item-actions"><button class="text-btn ${saved.has(item.id)?'saved':''}" data-save="${esc(item.id)}">${saved.has(item.id)?'Saved':'Save'}</button><button class="text-btn" data-open="${esc(item.id)}">Details</button></div></article>`).join('');host.querySelectorAll('[data-save]').forEach(btn=>btn.addEventListener('click',()=>{const id=btn.dataset.save;saved.has(id)?saved.delete(id):saved.add(id);try{localStorage.setItem(storageKey+':saved',JSON.stringify([...saved]))}catch(e){}renderFilters();renderItems();toast(saved.has(id)?'Saved to this browser.':'Removed from saved items.')}));host.querySelectorAll('[data-open]').forEach(btn=>btn.addEventListener('click',()=>{const item=items.find(x=>x.id===btn.dataset.open);const output=document.getElementById('tool-output');if(output)output.textContent=item.title+': '+item.detail+' '+item.foot;toast('Details opened in the project panel.')}))}
function renderChecklist(){const host=document.getElementById('check-list');host.innerHTML=APP.checklist.map((text,i)=>`<li class="check-row ${checklistDone.has(i)?'done':''}" data-check="${i}"><span class="check"></span><span>${esc(text)}</span></li>`).join('');host.querySelectorAll('[data-check]').forEach(row=>row.addEventListener('click',()=>{const id=Number(row.dataset.check);checklistDone.has(id)?checklistDone.delete(id):checklistDone.add(id);try{localStorage.setItem(storageKey+':check',JSON.stringify([...checklistDone]))}catch(e){}renderChecklist();activity.unshift(checklistDone.has(id)?'Checklist step completed':'Checklist step reopened');renderActivity()}))}
function renderActivity(){const host=document.getElementById('activity-list');host.innerHTML=activity.length?activity.slice(0,5).map(line=>`<li class="activity-row"><span class="activity-dot"></span><span>${esc(line)}</span></li>`).join(''):'<li class="activity-row"><span>No activity yet. Your actions will appear here.</span></li>'}
function renderTool(){const tool=APP.tool;let input='';if(tool.mode==='select'){input=`<select class="control" id="tool-value" aria-label="${esc(tool.title)}"><option value="">Choose an option</option>${tool.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`}else if(tool.mode==='code'){input=`<textarea class="control" id="tool-value" aria-label="Code to inspect" spellcheck="false">${esc(tool.sample||'')}</textarea>`}else{input=`<input class="control" id="tool-value" aria-label="${esc(tool.title)}" placeholder="${esc(tool.placeholder||'Enter a value')}">`}document.getElementById('tool-panel').innerHTML=`<div class="tool-head"><div><div class="eyebrow">Local workspace tool</div><h3 style="margin-top:5px">${esc(tool.title)}</h3></div><span class="tool-icon">✦</span></div><p>${esc(tool.prompt)}</p>${input}<button class="btn btn-primary" id="run-tool">${esc(tool.button)}</button><div class="tool-output" id="tool-output"></div>`;document.getElementById('run-tool').addEventListener('click',runTool)}
function addActivity(message){activity.unshift(message);renderActivity()}
function runTool(){const value=(document.getElementById('tool-value')?.value||'').trim();const output=document.getElementById('tool-output');
if(APP.action==='code'){if(!value){output.textContent=APP.noDataAction;return}analysisRuns++;try{localStorage.setItem(storageKey+':runs',String(analysisRuns))}catch(e){}const findings=[];if(/\beval\s*\(/i.test(value))findings.push('eval() execution');if(/\.innerHTML\s*=/i.test(value))findings.push('HTML injection risk');if(/(api[_-]?key|password|secret)\s*[:=]\s*["'][^"']{4,}/i.test(value))findings.push('credential-like value');if(/document\.write\s*\(/i.test(value))findings.push('document.write usage');output.textContent=findings.length?'Patterns in your code to inspect: '+findings.join(', ')+'. Review context and choose a safe fix.':'No patterns from this small rule set were found. That does not prove the code is secure.';renderMetrics();addActivity('Your pasted code was checked locally');return}
if(['analyze','review','scan','booking','trip','route','reconcile','profile'].includes(APP.action)||(['match'].includes(APP.action)&&items.length===0)){output.textContent=APP.noDataAction;addActivity('Data readiness checked');return}
if(APP.action==='step'){if(!value){output.textContent='Choose a checklist step first.';return}const idx=APP.checklist.findIndex(x=>x.toLowerCase().includes(value.split(' ')[0].toLowerCase()));if(idx>=0)checklistDone.add(idx);try{localStorage.setItem(storageKey+':check',JSON.stringify([...checklistDone]))}catch(e){}renderChecklist();renderMetrics();output.textContent=APP.tool.success;addActivity(value+' opened');return}
if(APP.action==='task'||APP.action==='post'||APP.action==='checkin'||APP.action==='mood'){if(!value){output.textContent='Enter your own information first. Nothing is preloaded.';return}items.unshift({id:'user-'+Date.now(),title:value,category:APP.categories[0],detail:'Entered by you. This stays on this device and is not sent to anyone.',foot:'Stored locally • just now',status:APP.action==='post'?'Draft':'Private'});persistItems();renderFilters();renderItems();renderMetrics();output.textContent=APP.tool.success;addActivity(APP.action==='post'?'Your challenge draft was saved locally':'Your entry was saved locally');return}
if(APP.action==='match'){if(!value){output.textContent=APP.noDataAction;return}document.getElementById('search').value=value;renderItems();output.textContent='Filtered only the real records you entered here. No external postings or awards were searched.';return}
output.textContent=APP.noDataAction}
document.getElementById('search').addEventListener('input',renderItems);
document.getElementById('saved-view').addEventListener('click',()=>{showSaved=!showSaved;activeCategory='All';renderFilters();renderItems();toast(showSaved?'Showing saved items.':'Showing all items.')});
document.getElementById('add-form').addEventListener('submit',event=>{event.preventDefault();const input=document.getElementById('add-input');const value=input.value.trim();if(!value)return;items.unshift({id:'custom-'+Date.now(),title:value,category:APP.customCategory||APP.categories[0],detail:'Entered by you. Add a verified source or notes before relying on this record.',foot:'Stored on this device • just now',status:'User added'});persistItems();input.value='';showSaved=false;activeCategory='All';renderFilters();renderItems();renderMetrics();addActivity('Added “'+value+'” to this device');toast('Saved on this device only.')});
document.getElementById('main-action').addEventListener('click',()=>{document.getElementById('tool-panel').scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('tool-value')?.focus()});
renderMetrics();renderFilters();renderItems();renderChecklist();renderActivity();renderTool();
</script>
</body>
</html>
